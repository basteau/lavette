<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Typography comparison</title><style>
*{box-sizing:border-box}body{margin:24px;background:#faf9f5;color:#242422;font:16px/1.5 system-ui}main{max-width:1100px;margin:auto}.pair{border-top:1px solid #bbb;padding:20px 0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:32px}.sample{font:400 clamp(28px,4vw,48px)/var(--leading) var(--display);letter-spacing:normal;margin:12px 0}body{font-synthesis:none}.before{--leading:1.1;letter-spacing:-.035em}.body{font:400 16px/1.5 var(--sans);max-width:65ch}.spacing .sample,.spacing .body{line-height:1.5!important;letter-spacing:.12em!important;word-spacing:.16em!important}.spacing p{margin-bottom:2em}button{font:inherit;padding:8px 16px}@media(max-width:600px){.comparison{grid-template-columns:1fr}}
</style><main><h1>Display typography comparison</h1><p>Previous spacing alongside the selected setting. Accented Latin copy, regular display weight, native body spacing.</p><button id="spacing" aria-pressed="false">Test user text spacing</button><div id="pairs"></div></main><script type="module">
import {FONT_PAIRINGS,fontFaces} from '/src/fonts.ts';
const style=document.createElement('style');style.textContent=FONT_PAIRINGS.map(p=>fontFaces(p.id)).join('\n');document.head.append(style);
document.querySelector('#pairs').innerHTML=FONT_PAIRINGS.map(p=>`<section class="pair" style="--display:'${p.serif}';--sans:'${p.sans}';--leading:${p.displayLeading}"><h2>${p.name}: ${p.serif} + ${p.sans}</h2><div class="comparison"><div><strong>Before · 1.1 / −0.035em</strong><p class="sample before">A little colour.<br>A lot of feeling.<br>Élévation & Ångström</p></div><div><strong>Selected · ${p.displayLeading} / normal</strong><p class="sample">A little colour.<br>A lot of feeling.<br>Élévation & Ångström</p></div></div><p class="sample"><em>Élévation, Ångström & quiet details.</em></p><p class="body">A considered interface gives every word room. Crème brûlée, özgürlük, and the quiet details. <strong>Clear emphasis</strong> and a comfortable rhythm for reading. ${p.sans === "Manrope" ? "Manrope supplies no italic; use weight for emphasis." : "<em>True italic: a thoughtful detail.</em>"}</p></section>`).join('');
document.querySelector('#spacing').onclick=e=>{const active=document.body.classList.toggle('spacing');e.currentTarget.setAttribute('aria-pressed',String(active))};
</script></html>
