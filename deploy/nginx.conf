server {
    listen 8000;
    listen [::]:8000;
    server_name lavette.exe.xyz;
    root /var/www/lavette/current;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
    }
}
